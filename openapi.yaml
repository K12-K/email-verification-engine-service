openapi: 3.0.3
info:
  title: Email Verification Engine API
  version: 1.4.0
  description: Internal asynchronous email verification service API.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: Healthy }
        '503': { description: Unhealthy }
  /v1/jobs:
    post:
      summary: Create an asynchronous verification job
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 8, maxLength: 255 }
          description: Reusing the same key with the same request returns the original job. Reusing it with a different request returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
                clientReferenceId:
                  type: string
                  maxLength: 128
      responses:
        '202':
          description: Job accepted
        '400': { description: Invalid request }
        '409': { description: Idempotency conflict }
        '429': { description: Rate limited }
  /v1/jobs/{id}:
    get:
      summary: Get job status and progress
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Job status }
        '404': { description: Job not found }
  /v1/jobs/{id}/results:
    get:
      summary: Get paginated verification results
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Paginated results }
        '404': { description: Job not found }
  /v1/jobs/{id}/cancel:
    post:
      summary: Cancel a queued or processing job
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Job cancelled }
        '404': { description: Job not found }
        '409': { description: Job cannot be cancelled }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
