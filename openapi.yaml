openapi: 3.0.3
info:
  title: Email Verification Engine API
  version: 1.6.0
  description: Internal asynchronous email verification service API.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: Healthy }
        '503': { description: Unhealthy }
  /v1/jobs:
    post:
      summary: Create an asynchronous verification job
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 8, maxLength: 255 }
          description: Reusing the same key with the same request returns the original job. Reusing it with a different request returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
                clientReferenceId:
                  type: string
                  maxLength: 128
      responses:
        '202':
          description: Job accepted
        '400': { description: Invalid request }
        '409': { description: Idempotency conflict }
        '429': { description: Rate limited }
  /v1/jobs/by-reference/{clientReferenceId}:
    get:
      summary: Find a job by the application client reference ID
      description: Used by the application to reconcile a create request when the engine response was lost.
      parameters:
        - in: path
          name: clientReferenceId
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404': { description: Job not found }
        '409': { description: Multiple jobs found for reference }
  /v1/jobs/{id}:
    get:
      summary: Get job status and progress
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Stable job status and progress response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404': { description: Job not found }
  /v1/jobs/{id}/results:
    get:
      summary: Get paginated verification results
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: status, schema: { type: string, enum: [invalid, no_mx, undeliverable, likely_deliverable, deliverable, catch_all, temporary_error, unknown] } }
      responses:
        '200':
          description: Paginated results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsResponse'
        '404': { description: Job not found }
  /v1/jobs/{id}/cancel:
    post:
      summary: Cancel a queued or processing job
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Job cancelled }
        '404': { description: Job not found }
        '409': { description: Job cannot be cancelled }
components:
  schemas:
    JobStatusResponse:
      type: object
      required: [jobId, status, total, processed, progressPercent, counts, requestId]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        total: { type: integer }
        processed: { type: integer }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        counts:
          type: object
          properties:
            deliverable: { type: integer }
            undeliverable: { type: integer }
            catchAll: { type: integer }
            noMx: { type: integer }
            invalid: { type: integer }
            unknown: { type: integer }
            temporaryError: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        clientReferenceId: { type: string, nullable: true }
        requestId: { type: string, format: uuid }
    ResultsResponse:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        status: { type: string, nullable: true }
        results:
          type: array
          items: { type: object }
        requestId: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
